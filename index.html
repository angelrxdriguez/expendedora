<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expendedora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="maquina">
            <img src="res/img/logo.png" alt="" class="logo">
        <div class="expendedora">
            <div class="secciones">
                <div class="productos">
                    <div class="producto gratis">
                        <img src="res/items/manzana.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">00</span>
                            <span class="precio free">1€</span>
                        </div>
                    </div>
                    <div class="producto prod1">
                        <img src="res/items/zanahoria.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">01</span>
                            <span class="precio medio">2€</span>
                        </div>
                    </div>
                    <div class="producto prod2">
                        <img src="res/items/espada.gif" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">02</span>
                            <span class="precio medio">5€</span>
                        </div>
                    </div>
                    <div class="producto prod3">
                        <img src="res/items/diamante.webp" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">03</span>
                            <span class="precio medio">15€</span>
                        </div>
                    </div>
                    <div class="producto prod4">
                        <img src="res/items/esmeralda.webp" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">04</span>
                            <span class="precio caro">70€</span>
                        </div>
                    </div>
                </div>
                <div class="botones">
                    <!--contador de dinero ingresado-->
                    <div class="dinero-ingresado">0€</div>
                    <button class="btn-billete" data-bs-toggle="modal" data-bs-target="#modalIngresar">
                        <img src="res/img/assets/billete.png" alt="" class="billete">
                    </button>
                </div>
                <div class="panel">
                    <div class="numeros">
                        <div class="fila1">
                            <div class="num-seleccionado">
                                <h3 id="num" class="num">PIDE</h3>
                            </div>
                        </div>
                        <div class="fila2">
                            <button class="btn-comprar">
<img src="res/img/assets/comprar2.png" alt="" srcset="" class="comprar"">
                            </button>
                        </div>
                        <div class="fila3">
                            <button id="num1" class="btn-num">1</button>
                            <button id="num2" class="btn-num">2</button>
                            <button id="num3" class="btn-num">3</button>
                            <button id="num4" class="btn-num">4</button>
                            <button id="num5" class="btn-num">5</button>
                            <button id="num6" class="btn-num">6</button>
                            <button id="num7" class="btn-num">7</button>
                            <button id="num8" class="btn-num">8</button>
                            <button id="num9" class="btn-num">9</button>
                            <button id="num-borrar" class="text-danger btn-candado">
                                <img src="res/img/assets/candado.png" alt="" class="candado">
                            </button>
                            <button id="num0" class="btn-num">0</button>
                            <button id="num-limpiar" class="text-danger btn-num">
                                <img src="res/img/assets/cancelar.png" alt="" class="cancelar"">
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!--Modal de ingresar dinero-->
    <div class="modal fade" id="modalIngresar" tabindex="-1" aria-labelledby="modal-ingresar-dinero-label" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modal-ingresar-dinero-label">Ingresar Dinero</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="text-center mb-4">
                        <h4>Total: <span id="total-maquina-modal">0€</span></h4>
                    </div>
                    <!-- Sección de Billetes -->
                    <div class="mb-4">
                        <h6 class="mb-3">Billetes</h6>
                        <div class="d-flex justify-content-around flex-wrap gap-3">
                            <button type="button" class="btn btn-outline-primary btn-billete-modal" data-valor="5">
                                <img src="res/img/assets/billete.png" alt="5€" class="img-fluid" style="max-width: 80px;">
                                <div class="mt-2">5€</div>
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-billete-modal" data-valor="10">
                                <img src="res/img/assets/billete.png" alt="10€" class="img-fluid" style="max-width: 80px;">
                                <div class="mt-2">10€</div>
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-billete-modal" data-valor="20">
                                <img src="res/img/assets/billete.png" alt="20€" class="img-fluid" style="max-width: 80px;">
                                <div class="mt-2">20€</div>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <h6 class="mb-3">Monedas</h6>
                        <div class="d-flex justify-content-around flex-wrap gap-3">
                            <button type="button" class="btn btn-outline-secondary btn-moneda-modal" data-valor="0.10">
                                <img src="res/img/assets/moneda.png" alt="10 cent" class="img-fluid" style="max-width: 60px;">
                                <div class="mt-2">10 cent</div>
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-moneda-modal" data-valor="0.20">
                                <img src="res/img/assets/moneda.png" alt="20 cent" class="img-fluid" style="max-width: 60px;">
                                <div class="mt-2">20 cent</div>
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-moneda-modal" data-valor="0.50">
                                <img src="res/img/assets/moneda.png" alt="50 cent" class="img-fluid" style="max-width: 60px;">
                                <div class="mt-2">50 cent</div>
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-moneda-modal" data-valor="1">
                                <img src="res/img/assets/moneda.png" alt="1€" class="img-fluid" style="max-width: 60px;">
                                <div class="mt-2">1€</div>
                            </button>
                            <button type="button" class="btn btn-outline-secondary btn-moneda-modal" data-valor="2">
                                <img src="res/img/assets/moneda.png" alt="2€" class="img-fluid" style="max-width: 60px;">
                                <div class="mt-2">2€</div>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="jquery.js"></script>
    <script>
        //modal de ingresar dinero
        const btnIngresar = document.getElementById('btnIngresar');
        btnIngresar.addEventListener('click', () => {
            modalIngresar.show();
        });
    </script>
</body>

</html>
