<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="maquina.css">
</head>
<body>
    <div class="container my-4">
        <h1 class="mb-4">Máquina expendedora</h1>

        <div class="row">
            <div class="col-md-4 mb-3">
                <div class="card bg-dark text-white text-center">
                    <div class="card-header">
                        Productos
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark text-center table-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Cantidad</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-productos">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-dark text-white text-center">
                    <div class="card-header">
                        Monedas
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark text-center table-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Valor</th>
                                    <th>Cantidad</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-monedas">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card bg-dark text-white text-center">
                    <div class="card-header">
                        Billetes
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-dark text-center t    able-sm mb-0">
                            <thead>
                                <tr>
                                    <th>Valor</th>
                                    <th>Cantidad</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-billetes">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="jquery.js"></script>
</body>
</html>
