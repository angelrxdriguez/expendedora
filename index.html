<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expendedora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <div class="maquina">
        <div class="banner">
            <h1 class="tit">LOOT BOXES</h1>
            <h4 class="subtit">24 / 7</h4>
        </div>
        <div class="expendedora">
            <div class="secciones">
                <div class="productos">
                    <div class="producto gratis">
                        <img src="res/ico/caja.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">00</span>
                            <span class="precio free">0€</span>
                        </div>
                    </div>
                    <div class="producto prod1">
                        <img src="res/ico/caja.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">01</span>
                            <span class="precio medio">2€</span>
                        </div>
                    </div>
                    <div class="producto prod2">
                        <img src="res/ico/caja2.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">02</span>
                            <span class="precio medio">5€</span>
                        </div>
                    </div>
                    <div class="producto prod3">
                        <img src="res/ico/caja.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">03</span>
                            <span class="precio medio">15€</span>
                        </div>
                    </div>
                    <div class="producto prod4">
                        <img src="res/ico/caja.png" class="img-prod" alt="">
                        <div class="datos-prod">
                            <span class="codigo">04</span>
                            <span class="precio caro">70€</span>
                        </div>
                    </div>
                </div>
                <div class="botones">
                    <a href="monedas.html">
                        <button class="btn-monedas">
                            <i class="bi bi-coin "></i>
                        </button>
                    </a>
                    <a href="billetes.html">
                        <button class="btn-billete">
                            <i class="bi bi-cash"></i>
                        </button>
                    </a>
                </div>
                <div class="panel">
                    <div class="numeros">
                        <div class="fila1">
                            <div class="num-seleccionado">
                                <h3 id="num" class="num">PIDE</h3>
                            </div>
                        </div>
                        <div class="fila2">
                            <button class="btn-comprar">
                                <i class="bi bi-box-seam-fill"></i>
                            </button>
                        </div>
                        <div class="fila3">
                            <button id="num1" class="btn-num">1</button>
                            <button id="num2" class="btn-num">2</button>
                            <button id="num3" class="btn-num">3</button>
                            <button id="num4" class="btn-num">4</button>
                            <button id="num5" class="btn-num">5</button>
                            <button id="num6" class="btn-num">6</button>
                            <button id="num7" class="btn-num">7</button>
                            <button id="num8" class="btn-num">8</button>
                            <button id="num9" class="btn-num">9</button>
                            <button id="num-borrar" class="text-danger btn-num">
                            </button>
                            <button id="num0" class="btn-num">0</button>
                            <button id="num-limpiar" class="text-danger btn-num">
                                <i class="bi bi-x-square-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <div class="inventario">
        <div class="dinero">
            <span id="dinero-usuario">0€</span>
        </div>
        <div class="cajas">
            <div class="caja">
                <img src="res/ico/caja.png" alt="" class="">
                <span id="num-cajas">0</span>
            </div>
     <div class="caja">
                <img src="res/ico/caja1.png" alt="" class="">
                <span id="num-cajas1">0</span>
            </div>
     <div class="caja">
                <img src="res/ico/caja2.png" alt="" class="">
                <span id="num-cajas2">0</span>
            </div>
                 <div class="caja">
                <img src="res/ico/caja3.png" alt="" class="">
                <span id="num-cajas3">0</span>
            </div>
                 <div class="caja">
                <img src="res/ico/caja4.png" alt="" class="">
                <span id="num-cajas4">0</span>
            </div>
        </div>
    </div>
    <script src="jquery.js"></script>
</body>

</html>
